<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2338"/>
      <stop offset="100%" stop-color="#060F1C"/>
    </linearGradient>
    <linearGradient id="helmetFemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C"/>
      <stop offset="100%" stop-color="#CBAB58"/>
    </linearGradient>
    <linearGradient id="vestFemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgFem)" stroke="#CBAB58" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Long Hair (Back) -->
  <path d="M37 54 C33 72, 35 92, 42 100 M83 54 C87 72, 85 92, 78 100" stroke="#3D271D" stroke-width="12" stroke-linecap="round"/>

  <!-- Shoulders & Engineering Vest -->
  <path d="M28 112 C28 92, 43 83, 60 83 C77 83, 92 92, 92 112 Z" fill="url(#vestFemGrad)"/>
  <!-- Vest Reflective Stripes -->
  <path d="M43 85 L46 112 M77 85 L74 112" stroke="#CBAB58" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner shirt collar -->
  <polygon points="54,83 60,92 66,83 60,86" fill="#FFFFFF"/>

  <!-- Neck -->
  <rect x="53" y="70" width="14" height="15" rx="3" fill="#E8B382"/>

  <!-- Head / Face -->
  <ellipse cx="60" cy="56" rx="16" ry="19" fill="#F7CA9F"/>
  <!-- Ears & Pearl Earrings -->
  <circle cx="44" cy="57" r="4" fill="#E8B382"/>
  <circle cx="76" cy="57" r="4" fill="#E8B382"/>
  <circle cx="44" cy="60" r="1.8" fill="#FFFFFF"/>
  <circle cx="76" cy="60" r="1.8" fill="#FFFFFF"/>
  
  <!-- Eyes with Lashes -->
  <circle cx="53" cy="55" r="2.2" fill="#1A202C"/>
  <circle cx="67" cy="55" r="2.2" fill="#1A202C"/>
  <path d="M51 52 L48 51 M69 52 L72 51" stroke="#1A202C" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M49 50 Q53 47 57 49" stroke="#4A5568" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M63 49 Q67 47 71 50" stroke="#4A5568" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  
  <!-- Nose & Smile -->
  <path d="M60 55 L58.5 60 L61.5 60" stroke="#D69E6E" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M54 64 Q60 68 66 64" stroke="#C53030" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Hair Strands Front -->
  <path d="M41 44 Q46 54 44 64 M79 44 Q74 54 76 64" stroke="#4A2E1B" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- Engineer Hard Hat (Casco) -->
  <path d="M38 42 C38 25, 82 25, 82 42 Z" fill="url(#helmetFemGrad)"/>
  <!-- Helmet Brim -->
  <path d="M33 42 Q60 40 87 42 C87 45, 33 45, 33 42 Z" fill="#B89745"/>
  <!-- Helmet Crest/Ridge -->
  <rect x="57" y="26" width="6" height="15" rx="2" fill="#FFE58F"/>
</svg>